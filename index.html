<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lotto Number Recommender</title>
  <link href='/style.css' rel='stylesheet'>
</head>
<body>
  <button id="theme-btn">🌙 Dark Mode</button>
  <h1>Lotto Number Recommender</h1>

  <nav class="tabs">
    <button class="tab active" data-tab="generator">번호 추천</button>
    <button class="tab" data-tab="stats">통계</button>
  </nav>

  <section id="generator" class="tab-content active">
    <button id="lotto-btn">Get Lotto Numbers</button>
    <div id="lotto-numbers"></div>
  </section>

  <section id="stats" class="tab-content">
    <h2>번호별 출현 빈도</h2>
    <div id="freq-chart"></div>

    <div class="stats-row">
      <div class="stats-card">
        <h3>최다 출현 TOP 10</h3>
        <ol id="top10"></ol>
      </div>
      <div class="stats-card">
        <h3>최소 출현 TOP 10</h3>
        <ol id="bottom10"></ol>
      </div>
    </div>

    <h2>최근 10회차 당첨번호</h2>
    <table id="recent-table">
      <thead>
        <tr>
          <th>회차</th>
          <th>번호1</th>
          <th>번호2</th>
          <th>번호3</th>
          <th>번호4</th>
          <th>번호5</th>
          <th>번호6</th>
          <th>보너스</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <script defer type="text/javascript" src="/main.js"></script>
</body>
</html>
